name: Botanalytics
description: >-
  Botanalytics is a conversational analytics platform for AI chatbots and voice
  assistants. It helps bot builders and product teams measure engagement, understand
  user intents and natural-language understanding (NLU) quality, segment conversations,
  identify bottlenecks and drop-off points, and surface audience insights across 20+
  languages and multiple messaging and voice channels (Facebook Messenger, Amazon
  Alexa, Microsoft Bot Framework, Samsung Bixby, and a universal channel). Conversation
  data is sent either through native no-code integrations, first-party SDKs (Node,
  Python, Java, Ruby), or a v2 REST ingestion API secured with Bearer JWT API keys.
  Botanalytics is backed by 500 Global.
